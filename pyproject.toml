[project]
name = "py_staticpage_builder"
version = "2026.05.06.1"
description = "Static page generator."
readme = "README.md"
requires-python = "~=3.14"
license = { file = "LICENSE" }
authors = [{ name = "Arnaldo Ono", email = "programmer@onoarnaldo.com" }]
keywords = ["static page", "builder"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators"
]
dependencies = [
    "jinja2~=3.1",
    "click~=8.3",
    "markdown~=3.10",
    "minify-html~=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.0",
    "coverage~=7.13",
    "ruff~=0.15",
]

[project.urls]
#homepage = "https://example.com"
#documentation = "https://readthedocs.org"
repository = "https://github.com/OnoArnaldo/py_staticpage_builder"
#changelog = "https://github.com/me/spam/blob/master/CHANGELOG.md"

[tool.pip-tools]
generate-hashes = true
strip-extras = true

[tool.ruff.format]
quote-style = "double"